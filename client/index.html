    <!-- Google Analytics 4 — replace G-XXXXXXXXXX with your Measurement ID -->
    <script>
      window.HARMONY_GA_ID = "G-XXXXXXXXXX"; // <-- paste your real GA4 ID here
      if (window.HARMONY_GA_ID && window.HARMONY_GA_ID !== "G-XXXXXXXXXX") {
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + window.HARMONY_GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", window.HARMONY_GA_ID, { anonymize_ip: true });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA service worker registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
          });
        });
      }
    </script>
  </body>
